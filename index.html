Lowest since": "Terendah sejak itu", "Now": "Sekarang", "All episodes": "Semua episode", "High / low so far": "Tertinggi / terendah sejauh ini", "CIS, narratives and attention are out of date; no signal can become BUY until a new scan finishes.": "CIS, narasi, dan attention sudah kedaluwarsa; tidak ada sinyal yang bisa jadi BUY sampai scan baru selesai.", "Breadth, liquidity and movers across every eligible Binance Spot USDT pair.": "Breadth, likuiditas, dan pergerakan di seluruh pair USDT Binance Spot yang eligible.", "Tiers decide which pairs are liquid enough for signals in Phase 5. Tier E pairs stay visible but will not produce BUY signals.": "Tier menentukan pair mana yang cukup likuid untuk sinyal. Pair tier E tetap terlihat tetapi tidak akan menghasilkan BUY.", "Every Binance Spot USDT pair with status TRADING, checked against spot permission and exchange filters.": "Semua pair USDT Binance Spot berstatus TRADING, dicek terhadap izin spot dan filter exchange.", "Tokenized stocks are detected by Binance's naming rule (base ends in B, e.g. NVDAB); ARB, BNB, SHIB and similar crypto are kept.": "Token saham dikenali dari aturan penamaan Binance (kode diakhiri B, misalnya NVDAB); ARB, BNB, SHIB, dan kripto serupa tetap dimasukkan.", "No snapshot yet. The first load records a baseline; later listings and delistings appear here.": "Belum ada snapshot. Pemuatan pertama mencatat acuan awal; listing dan delisting berikutnya muncul di sini.", "Connection state, candle quality and the acceptance tests behind every number on this page.": "Status koneksi, kualitas candle, dan tes penerimaan di balik setiap angka di halaman ini.", "connector calls retry once when Binance marks an error as temporary": "panggilan connector diulang sekali bila Binance menandai error sebagai sementara", "A timeframe that is stale or invalid is marked not usable; later phases will refuse to produce signals from it.": "Timeframe yang basi atau tidak valid ditandai tidak bisa dipakai; sinyal tidak akan dibuat darinya.", "Sign in to claude.ai to save the taxonomy and daily snapshots. Without it, classification cannot be stored.": "Masuk ke claude.ai untuk menyimpan taxonomy dan snapshot harian. Tanpa itu, klasifikasi tidak bisa disimpan.", "Run a scan to score the 16 narratives from Binance daily candles.": "Jalankan scan untuk memberi skor 16 narasi dari candle harian Binance.", "No narrative snapshot yet. Classification runs in the background; press Run scan when it has covered the liquid pairs.": "Belum ada snapshot narasi. Klasifikasi berjalan di latar; tekan Run scan setelah pair likuid tercakup.", "Score = 0.30 momentum + 0.20 growth + 0.15 freshness + 0.15 catalyst + 0.20 adoption, over available metrics": "Skor = 0,30 momentum + 0,20 pertumbuhan + 0,15 kesegaran + 0,15 katalis + 0,20 adopsi, dari metrik yang tersedia", "The first scan saves today's snapshot. One snapshot is kept per closed day.": "Scan pertama menyimpan snapshot hari ini. Satu snapshot disimpan per hari tertutup.", "No headline in the last 72 hours named this narrative or one of its members.": "Tidak ada headline dalam 72 jam terakhir yang menyebut narasi ini atau anggotanya.", "CoinGecko categories mapped by fixed rules; edit any coin to set verified labels": "Kategori CoinGecko dipetakan dengan aturan tetap; ubah koin mana pun untuk memberi label terverifikasi", "Where trading attention is concentrating now. Components are percentile ranks across the eligible universe (0–100); order book imbalance is absolute.": "Ke mana perhatian trading sedang terkumpul. Komponen adalah peringkat persentil di universe eligible (0–100); order book imbalance bersifat absolut.", "Each cell shows the 0–100 score and the raw value. n/a = UNAVAILABLE; the weights of the remaining components are re-normalised.": "Tiap sel menunjukkan skor 0–100 dan nilai mentahnya. n/a = TIDAK TERSEDIA; bobot komponen lain dinormalisasi ulang.", "D1 and H4 indicators for every eligible pair, from closed candles only. Quant score = 0.4 × D1 + 0.6 × H4.": "Indikator D1 dan H4 untuk setiap pair eligible, hanya dari candle tertutup. Skor Quant = 0,4 × D1 + 0,6 × H4.", "Select a row to open its multi-timeframe price action and SMC analysis.": "Pilih baris untuk membuka analisis price action dan SMC multi-timeframe.", "EMA 13×21 states: FRESH CROSS (bullish cross ≤ 5 closed bars ago), RETEST CONFIRMED (a later bar wicked into EMA21 within 0.25 ATR and closed above it, ≤ 3 bars ago), AWAITING RETEST, RETEST OLD, FAILED (closed below EMA21 after the cross), BEARISH.": "Status EMA 13×21: FRESH CROSS (cross bullish ≤ 5 bar tertutup lalu), RETEST CONFIRMED (bar sesudahnya menyentuh EMA21 dalam 0,25 ATR lalu ditutup di atasnya, ≤ 3 bar lalu), AWAITING RETEST, RETEST OLD, FAILED (ditutup di bawah EMA21 setelah cross), BEARISH.", "Multi-timeframe read for one pair: D1 macro trend, H4 structure, H1 setup, M15 entry, M5 refinement. Structure uses confirmed swings only.": "Pembacaan multi-timeframe satu pair: tren makro D1, struktur H4, setup H1, entry M15, penajaman M5. Struktur hanya memakai swing terkonfirmasi.", "Large trades on Binance (anonymous, exchange side) and labelled on-chain wallets. Exchange trades are never shown as wallet activity.": "Transaksi besar di Binance (anonim, sisi exchange) dan wallet on-chain berlabel. Transaksi exchange tidak pernah ditampilkan sebagai aktivitas wallet.", "Only labels you add, each with its source, verification status and confidence. Nothing is inferred or invented.": "Hanya label yang kamu tambahkan, masing-masing dengan sumber, status verifikasi, dan tingkat keyakinan. Tidak ada yang ditebak atau dikarang.", "No wallets yet. Add one with its source, for example an Etherscan public name tag.": "Belum ada wallet. Tambahkan satu beserta sumbernya, misalnya public name tag Etherscan.", "Where aggressive money is going on Binance Spot: taker buy minus taker sell (USDT), from closed H4 candles.": "Ke mana uang agresif mengalir di Binance Spot: taker buy dikurangi taker sell (USDT), dari candle H4 tertutup.", "a pair counts in every narrative it carries; classified pairs only": "satu pair dihitung di setiap narasi yang dimilikinya; hanya pair yang sudah diklasifikasi", "Taker flow measures who crossed the spread, not who holds. Volume share change compares the last 7 days with the 7 days before.": "Taker flow mengukur siapa yang menyeberangi spread, bukan siapa yang memegang. Perubahan porsi volume membandingkan 7 hari terakhir dengan 7 hari sebelumnya.", "Peak 4h share = the largest single H4 bar's share of the last 24h volume; high values mean volume arrived in one burst.": "Porsi 4 jam tertinggi = porsi satu bar H4 terbesar dari volume 24 jam terakhir; nilai tinggi berarti volume datang sekaligus.", "Wallet score (used by CIS in Phase 5) = 0.5 exchange flow + 0.5 on-chain. For liquid ERC-20 tokens with an on-chain sample it is HYBRID; otherwise the Flow score alone, labelled EXCHANGE ONLY.": "Skor wallet (dipakai CIS) = 0,5 flow exchange + 0,5 on-chain. Untuk token ERC-20 likuid dengan sampel on-chain statusnya HYBRID; selain itu hanya skor Flow, berlabel EXCHANGE ONLY.", "Historical replay of the price-derived trade rules, with walk-forward validation. Closed candles only.": "Uji ulang historis aturan trade berbasis harga, dengan validasi walk-forward. Hanya candle tertutup.", "What happened after every decision: forward returns on real candles, by BUY, WATCH and AVOID.": "Apa yang terjadi setelah setiap keputusan: return sesudahnya di candle nyata, per BUY, WATCH, dan AVOID.", "Forward test: trading plans tracked as simulated trades on real candles. No order is ever placed.": "Uji ke depan: trading plan dilacak sebagai trade simulasi di candle nyata. Tidak ada order yang pernah dikirim.", "CIS ranks candidates; a BUY needs every hard filter. Spot, long-only. Signals are information: no order is ever placed.": "CIS memeringkat kandidat; BUY butuh semua filter wajib lolos. Spot, long-only. Sinyal adalah informasi: tidak ada order yang dikirim.", "These rules have not been tested on history yet. Run a historical test before trusting any BUY.": "Aturan ini belum diuji pada data historis. Jalankan uji historis sebelum memercayai BUY apa pun.", "BUY is blocked by the validation filter; plans still appear as WATCH and are paper-traded.": "BUY diblok oleh filter validasi; plan tetap muncul sebagai WATCH dan dicatat di paper trading.", "The validation filter is switched off in Risk Management, so BUY can still appear.": "Filter validasi dimatikan di Risk Management, jadi BUY masih bisa muncul.", "Account equity is not set, so position sizing and risk controls fail for every pair and no BUY can appear. Set it in Risk Management.": "Ekuitas akun belum diisi, jadi ukuran posisi dan kontrol risiko gagal untuk setiap pair dan BUY tidak bisa muncul. Isi di Risk Management.", "liquidity. Select any pair in the ranking below to evaluate it.": "likuiditas. Pilih pair mana pun di peringkat di bawah untuk mengevaluasinya.", "Select a row to run the full multi-timeframe evaluation and hard filters for that pair. 'ex' = wallet score from exchange flow only.": "Pilih baris untuk menjalankan evaluasi multi-timeframe lengkap dan filter wajib untuk pair itu. 'ex' = skor wallet hanya dari flow exchange.", "Each part is 0–100. A missing part is left out and the others are re-weighted. FULL = all five inputs measured, each with at least 75% of its own parts, and Wallet must include on-chain data (HYBRID); otherwise PARTIAL. Coverage % shows how much of the full weight was measured. Quant and Attention are required.": "Tiap bagian bernilai 0–100. Bagian yang hilang dikeluarkan dan bobot lainnya disesuaikan. FULL = kelima input terukur, masing-masing minimal 75% bagiannya, dan Wallet harus mencakup data on-chain (HYBRID); selain itu PARTIAL. Persentase cakupan menunjukkan berapa bagian bobot penuh yang terukur. Quant dan Attention wajib.", "only when all 8 hard filters pass: CIS, fresh data, liquidity, confirmed bullish MTF setup, valid stop, net R:R, valid position size, risk controls. A failed filter always overrides a high CIS.": "hanya bila 8 filter wajib lolos: CIS, data segar, likuiditas, setup MTF bullish terkonfirmasi, stop valid, R:R bersih, ukuran posisi valid, kontrol risiko. Filter yang gagal selalu mengalahkan CIS tinggi.", "valid data and liquidity, CIS ≥ watch level, MTF bullish or developing.": "data dan likuiditas valid, CIS ≥ level watch, MTF bullish atau berkembang.", "Account limits that every BUY must pass. All parameters are configurable and saved for this artifact.": "Batas akun yang harus dilewati setiap BUY. Semua parameter bisa diubah dan disimpan untuk artifact ini.", "realized and unrealized PnL. Open positions are the journal's Open trades; today's PnL is trades closed since local midnight.": "PnL terealisasi dan belum terealisasi. Posisi terbuka adalah trade Open di jurnal; PnL hari ini adalah trade yang ditutup sejak tengah malam waktu lokal.", "Manual mode. Set a starting equity in Portfolio Analytics to take these from the trading journal instead.": "Mode manual. Isi ekuitas awal di Portfolio Analytics agar angka ini diambil dari jurnal trading.", "Block BUY while the latest historical test of the live rules shows NO EDGE": "Blok BUY selama uji historis terbaru aturan live menunjukkan TANPA EDGE", "Spot, long-only. Position size uses equity, entry, stop, fees, slippage and the pair's step size, min quantity and min notional.": "Spot, long-only. Ukuran posisi memakai ekuitas, entry, stop, fee, slippage, serta step size, kuantitas minimum, dan notional minimum pair.", "For liquid ERC-20 tokens, the latest 1,000 transfers come from Etherscan (Ethereum, Arbitrum or Polygon). The token contract is accepted only when CoinGecko's canonical id matches the coin. Exchange flows use the labelled exchange wallets in the registry below": "Untuk token ERC-20 likuid, 1.000 transfer terakhir diambil dari Etherscan (Ethereum, Arbitrum, atau Polygon). Kontrak token diterima hanya bila id kanonik CoinGecko cocok dengan koinnya. Flow exchange memakai wallet exchange berlabel di registry di bawah", "On-chain score: exchange netflow 50% (tokens leaving labelled exchanges score higher; needs ≥ 3 such transfers), supply change 20% (net mint lowers it), whale-transfer trend 30% (large transfers in the newer half vs the older half). Needs two of the three parts. Windows are short for busy tokens: 1,000 transfers can be under an hour.": "Skor on-chain: netflow exchange 50% (token yang keluar dari exchange berlabel mendapat skor lebih tinggi; butuh ≥ 3 transfer seperti itu), perubahan suplai 20% (net mint menurunkannya), tren transfer whale 30% (transfer besar di paruh terbaru vs paruh lama). Butuh dua dari tiga bagian. Jendela waktunya pendek untuk token ramai: 1.000 transfer bisa kurang dari satu jam.", "Still UNAVAILABLE with free sources: holder concentration (needs a top-holders endpoint), smart-money and wallet historical performance (need wallet labels at scale), and on-chain data for non-EVM coins such as BTC, SOL and XRP. Those pairs keep a PARTIAL CIS.": "Masih TIDAK TERSEDIA dari sumber gratis: konsentrasi holder (butuh endpoint top holder), smart money dan performa historis wallet (butuh label wallet skala besar), serta data on-chain untuk koin non-EVM seperti BTC, SOL, dan XRP. Pair tersebut tetap ber-CIS PARTIAL.", "Positions and performance from the trading journal, marked to live Binance prices. Fees and exit costs are included.": "Posisi dan performa dari jurnal trading, dinilai dengan harga live Binance. Fee dan biaya keluar sudah termasuk.", "Equity, drawdown and daily PnL are then computed from the journal, and Risk Management uses them automatically instead of the manual account state.": "Ekuitas, drawdown, dan PnL harian lalu dihitung dari jurnal, dan Risk Management memakainya otomatis menggantikan status akun manual.", "No open positions. Mark a journal entry as Open to track it here.": "Tidak ada posisi terbuka. Tandai entri jurnal sebagai Open untuk melacaknya di sini.", "Loads 60 daily candles per open position and correlates their last 30 daily returns.": "Memuat 60 candle harian per posisi terbuka dan mengorelasikan 30 return harian terakhirnya.", "No closed trades yet. Close a journal entry to start the statistics.": "Belum ada trade tertutup. Tutup entri jurnal untuk memulai statistik.", "Every planned, open and closed trade, with research notes. Statuses: Planned → Open → Closed, or Cancelled. Nothing here places an order.": "Setiap trade yang direncanakan, terbuka, dan tertutup, beserta catatan riset. Status: Planned → Open → Closed, atau Cancelled. Tidak ada yang mengirim order dari sini.", "No trades yet. Add one, or press 'Add to journal' on a trade signal.": "Belum ada trade. Tambahkan satu, atau tekan 'Tambah ke jurnal' di sinyal trade.", "No scan report yet. Run a scan from Market Overview or Narrative Intelligence.": "Belum ada laporan scan. Jalankan scan dari Market Overview atau Narrative Intelligence.", "A stage that is rate limited pauses and retries up to three times, then stops; later stages still run, and pairs that failed keep their previous values. Only a lost connection or a missing permission stops the whole scan.": "Tahap yang terkena rate limit berhenti sebentar dan mencoba ulang hingga tiga kali, lalu berhenti; tahap berikutnya tetap jalan, dan pair yang gagal mempertahankan nilai sebelumnya. Hanya koneksi yang terputus atau izin yang hilang yang menghentikan seluruh scan.", "Storage is this artifact's document database, not PostgreSQL. It keeps collections and documents with a 256 KB limit per document; there are no SQL joins or transactions across collections. The schema below maps every entity in the specification to where it lives.": "Penyimpanan memakai database dokumen artifact ini, bukan PostgreSQL. Isinya koleksi dan dokumen dengan batas 256 KB per dokumen; tidak ada join SQL atau transaksi antar-koleksi. Skema di bawah memetakan setiap entitas di spec ke tempat penyimpanannya.", "Only the price-derived rules can be replayed honestly: the D1→H4→H1→M15 multi-timeframe verdict must be BULLISH CONFIRMED, the SMC plan needs a stop within": "Hanya aturan berbasis harga yang bisa diuji ulang secara jujur: verdict multi-timeframe D1→H4→H1→M15 harus BULLISH CONFIRMED, plan SMC butuh stop maksimal", "Narrative, attention, wallet and on-chain history are not available point-in-time from free sources, so the full CIS cannot be back-tested; the Quant score (0.4·D1 + 0.6·H4) is the only CIS component replayed, as an optional gate.": "Riwayat narasi, attention, wallet, dan on-chain tidak tersedia per titik waktu dari sumber gratis, jadi CIS penuh tidak bisa di-backtest; skor Quant (0,4·D1 + 0,6·H4) satu-satunya komponen CIS yang diuji ulang, sebagai filter opsional.", "Closed candles only; triggered plans fill at the next M15 open, limit plans only when price reaches the entry within 24 h, and net R:R is re-checked at the fill; exits on M15 with the stop taken first when stop and target share a candle; time exit after 7 days;": "Hanya candle tertutup; plan yang terpicu terisi di open M15 berikutnya, plan limit hanya bila harga mencapai entry dalam 24 jam, dan R:R bersih dicek ulang saat fill; exit di M15 dengan stop didahulukan bila stop dan target ada di candle yang sama; keluar waktu setelah 7 hari;", "slippage per side. R = net PnL ÷ initial risk (entry − stop). One position per pair, at most": "slippage per sisi. R = PnL bersih ÷ risiko awal (entry − stop). Satu posisi per pair, maksimal", "About 14 connector calls per pair for 90 days; history is cached for 12 hours.": "Sekitar 14 panggilan connector per pair untuk 90 hari; riwayat di-cache selama 12 jam.", "Select a row to show that variant in the tiles, curve, gate table and trade list below. Showing": "Pilih baris untuk menampilkan varian itu di ringkasan, kurva, tabel filter, dan daftar trade di bawah. Ditampilkan", "Same candidates, keeping only those whose Quant score at the signal was at least the gate. Whole period (in-sample): use it to understand, not to choose.": "Kandidat yang sama, hanya yang skor Quant-nya saat sinyal minimal sebesar filter. Seluruh periode (in-sample): untuk memahami, bukan untuk memilih.", "blocks. Each fold picks the variant and gate with the highest total R on all earlier blocks (≥ 8 trades) and applies them unchanged to the next block. If even the best is not profitable in-sample, the fold stands aside.": "blok. Setiap fold memilih varian dan filter dengan total R tertinggi di semua blok sebelumnya (≥ 8 trade) dan memakainya tanpa diubah di blok berikutnya. Bila yang terbaik pun tidak untung in-sample, fold itu tidak trading.", "Verdict rules: fewer than 30 out-of-sample trades = NOT PROVEN; expectancy ≤ 0 = NO EDGE; t-statistic < 2 = NOT SIGNIFICANT; out-of-sample keeps < 50% of in-sample expectancy = DEGRADES; otherwise PASSES.": "Aturan verdict: kurang dari 30 trade out-of-sample = NOT PROVEN; ekspektansi ≤ 0 = NO EDGE; t-statistik < 2 = NOT SIGNIFICANT; out-of-sample mempertahankan < 50% ekspektansi in-sample = DEGRADES; selain itu PASSES.", "Every candidate is listed, including those the position limits skipped.": "Semua kandidat ditampilkan, termasuk yang dilewati karena batas posisi.", "Every BUY and WATCH trading plan is recorded as a simulated trade the moment it is evaluated, and any plan can be added by hand from its signal card. Fills and exits come from closed M15 candles after the signal, with the same rules as the historical test. No order is sent anywhere.": "Setiap trading plan BUY dan WATCH dicatat sebagai trade simulasi saat dievaluasi, dan plan mana pun bisa ditambahkan manual dari kartu sinyalnya. Fill dan exit diambil dari candle M15 tertutup setelah sinyal, dengan aturan yang sama seperti uji historis. Tidak ada order yang dikirim.", "Signals are only produced while this page is open and scanning, so paper trades cover the times you used it. Updated": "Sinyal hanya dibuat saat halaman ini terbuka dan memindai, jadi paper trade hanya mencakup waktu kamu memakainya. Diperbarui", "No paper trades yet. They appear when an evaluation returns BUY or WATCH with a plan.": "Belum ada paper trade. Paper trade muncul saat evaluasi menghasilkan BUY atau WATCH dengan plan.", "Recorded before the duplicate fix of 13 Nov; excluded from the statistics": "Tercatat sebelum perbaikan duplikat 13 Nov; tidak dihitung dalam statistik", "Grey R on open trades is marked to the last closed M15 candle and is not counted until the trade closes.": "R abu-abu pada trade terbuka dinilai dengan candle M15 tertutup terakhir dan baru dihitung setelah trade ditutup.", "Every decision the page made is followed forward on real M15 candles from the close of the candle it was made on: the return after 1, 3 and 7 days, and the highest and lowest price reached. Repeated evaluations of the same pair with the same decision count once (one episode). Use it to see, with data, how often AVOID was followed by a rally and how often WATCH or BUY was followed by a drop.": "Setiap keputusan halaman ini diikuti ke depan di candle M15 nyata, mulai dari penutupan candle saat keputusan dibuat: return setelah 1, 3, dan 7 hari, serta harga tertinggi dan terendah yang dicapai. Evaluasi berulang pair yang sama dengan keputusan yang sama dihitung satu kali (satu episode). Gunakan untuk melihat dengan data seberapa sering AVOID diikuti kenaikan dan seberapa sering WATCH atau BUY diikuti penurunan.", "A horizon that has not passed yet is left empty, never estimated. Decisions are only recorded while the page is open and evaluating. Updated": "Horizon yang belum lewat dibiarkan kosong, tidak pernah diperkirakan. Keputusan hanya tercatat saat halaman terbuka dan mengevaluasi. Diperbarui", "Rallied = the highest price inside the window was at least that far above the decision price; it is not the return you would have kept. Small samples mean little: wait for dozens /* ================= PHASE 3: quant screener, price action & SMC ================= */
const TF_LIST = ["1d", "4h", "1h", "15m", "5m"];
const TF_LIMIT = 300;
const msToNextClose = (tf) => { const iv = C.TF_MS[tf], now = Date.now(); return Math.max(30e3, Math.ceil(now / iv) * iv - now + 60e3); };
const btcClosed = (tf) => (S.kl[tf] && S.kl[tf].candles ? S.kl[tf].candles.filter((x) => x.closed) : null);
const r3 = (x) => x == null || !isFinite(x) ? null : +(+x).toPrecision(4);
// Compact per-timeframe record for the stored screen (the database caps one document at 256 KB).
const compactTF = (a) => a && a.ok ? { score: r3(a.quant.score), stack: a.stack, structure: a.structure, cross: a.cross.state, rsi: r3(a.ind.rsi), adx: r3(a.ind.adx), diUp: a.ind.pdi > a.ind.mdi, relVol: r3(a.ind.relVol), roc: r3(a.ind.roc), rs: r3(a.ind.rsVsBtc), zone: a.range && a.range.zone, atrPct: r3(a.ind.atrPct), ev: a.lastEvent ? `${a.lastEvent.dir} ${a.lastEvent.type} ${a.lastEvent.barsAgo}` : null } : null;
const DOC_MAX = 240 * 1024;
const docSize = (o) => new TextEncoder().encode(JSON.stringify(o)).length;

// stage 1 (inside runScan): D1 + H4 quant screen for every eligible pair
async function quantStage(rows, d1Raw) {
  S.scan.stage = "4h candles"; S.scan.done = 0; S.scan.total = rows.length; render();
  const q = {}, stale = msToNextClose("4h");
  const halted = await pool(rows, 4, async (r) => {
    const res = await bin("klines", { symbol: r.symbol, interval: "4h", limit: TF_LIMIT }, stale);
    const h4 = D.candleQuality(res.data, { symbol: r.symbol, tf: "4h", nowMs: Date.now(), fetchedAt: res.at, source: "Binance connector" }, C.normalizeKlines, C.TF_MS);
    const dRaw = d1Raw[r.symbol];
    const d1 = dRaw ? D.candleQuality(dRaw.data, { symbol: r.symbol, tf: "1d", nowMs: Date.now(), fetchedAt: dRaw.at, source: "Binance connector" }, C.normalizeKlines, C.TF_MS) : null;
    setKlineFlow(r.symbol, res.data);
    const ad = d1 ? Q.analyze(d1.candles, "1d", C, btcClosed("1d")) : null, ah = Q.analyze(h4.candles, "4h", C, btcClosed("4h"));
    q[r.symbol] = { score: r3(Q.screen(ad, ah)), d1: compactTF(ad), h4: compactTF(ah), usable: !!(h4.meta.usableForSignals && d1 && d1.meta.usableForSignals) };
  }, () => { S.scan.done++; if (S.scan.done % 12 === 0) render(); });
  // merge: pairs that failed this time keep their previous (older) row instead of disappearing
  if (Object.keys(q).length) { S.quant = Object.assign({}, S.quant || {}, q); S.quantAt = Date.now(); S.kflowAt = Date.now(); }
  return halted;
}

// stage 2: full MTF analysis of one symbol (5 timeframes)
async function analyseSymbol(sym, force) {
  if (!S.mcp || !sym) return null;
  S.smc.busy = sym; render();
  const tfs = {}, quality = {}, raw = {};
  try {
    await Promise.all(TF_LIST.map(async (tf) => {
      const res = await bin("klines", { symbol: sym, interval: tf, limit: TF_LIMIT }, force ? 0 : msToNextClose(tf));
      const qd = D.candleQuality(res.data, { symbol: sym, tf, nowMs: Date.now(), fetchedAt: res.at, source: "Binance connector" }, C.normalizeKlines, C.TF_MS);
      quality[tf] = qd.meta; raw[tf] = qd.candles; tfs[tf] = Q.analyze(qd.candles, tf, C, btcClosed(tf));
    }));
    const m = Q.mtf(tfs, quality);
    const rec = { sym, at: Date.now(), tfs, quality, m };
    S.smc.cache[sym] = rec; S.mtf[sym] = { verdict: m.verdict, why: m.why, quant: m.quant, steps: m.steps.map((s) => ({ tf: s.tf, state: s.state, pass: s.pass })), at: rec.at };
    S.smc.err = null;
    if (!S.smc.batch && S.db) S.db.doc("snapshots/mtf").set(mtfDoc()).catch(() => {});
    return rec;
  } catch (e) { S.smc.err = errText(e); return null; }

function computeCIS() {

  for (const r of eligibleBases()) {
    const sym = r.symbol, q = S.quant && S.quant[sym], a = S.attnBy && S.attnBy[sym], f = S.flowS[sym], x = tk(sym);

async function evaluateSymbol(sym, tag) {

  const rec = c0 && Date.now() - c0.at < 5 * 60e3 && c0.at >= m15Close ? c0 : await analyseSymbol(sym);
  if (!rec) return null;
  const cfg = cfgNow(), row = (S.cisRows || []).find((x) => x.sym === sym);

  let legacy = null;

    // Timing uses the live price when the ticker is under 2 min old, otherwise the last closed M15 close.

    try { timing = Object.assign(C.entryTiming({ d: tf["1d"]._A, h4: tf["4h"]._A, h1: tf["1h"]._A, m15: tf["15m"]._A }, legacy, live, LP, filters), { price: live }); } catch (x) { timing = null; }
  }

  const ev = G.evaluate({ symbol: sym, narrative: row2 && row2.narr, nowMs: Date.now(), cfg, riskState: riskNow(), cis: row2 ? row2.c : null, inputsAgeH: inputsAgeH(), mtf: rec.m, quality: rec.quality, ticker: tk(sym), filters, legacy, timing, sizing: C.positionSize, rr: C.rr, validation: validationNow() });
  const prev = S.signals[sym];

async function evaluateCandidates(n) {

async function persistPhase5() {
  if (!S.db) return;

    if (S.cisRows) {
      const rows = Object.fromEntries(S.cisRows.filter((x) => x.c.cis != null).map((x) => [x.sym, { cis: r3(x.c.cis), cls: x.c.cls, q: x.c.quality, n: r3(x.narrScore), a: r3(x.attn), w: r3(x.wallet), qu: r3(x.quant), r: r3(x.risk) }]));

      const day = new Date().toISOString().slice(0, 10);
      await S.db.doc("intelligenceHistory/" + day).set({ day, at: S.cisAt, top: S.cisRows.filter((x) => x.c.cis != null).slice(0, 50).map((x) => ({ s: x.sym, cis: r3(x.c.cis), cls: x.c.cls })) });
    }
    // Write an evaluation only when the decision changes or every 4 h per pair; re-evaluating the same pair every
    // 15 minutes with the same answer adds nothing and made the collection (and every page load) grow ~16× faster.
    const lastBy = {}; for (const x of S.sigAll || []) if (!lastBy[x.symbol] || x.candleAt > lastBy[x.symbol].candleAt) lastBy[x.symbol] = x;
    for (const ev of Object.values(S.signals)) {
      if (!ev || ev._saved) continue;
      const prev = lastBy[ev.symbol], at = ev.candleAt || ev.signalAt;
      if (prev && prev.decision === ev.decision && at - prev.candleAt < 4 * 3600e3 && at >= prev.candleAt) { ev._saved = true; continue; }
      // Watchlist-only evaluations (up to 200 pairs every hour) are written only when the decision changes, so they
      // do not crowd the 400 most recent signals that the outcome tracker reads.
      if (ev._wl && !ev._cand && !ev._manual && prev && prev.decision === ev.decision) { ev._saved = true; continue; }
      const id = `${ev.symbol}-${ev.candleAt || ev.signalAt}`;
      const rec = JSON.parse(JSON.stringify(ev));
      await S.db.doc("tradeSignals/" + id).set(rec);
      if (ev.decision === "BUY" && ev.plan) await S.db.doc("tradePlans/" + id).set(Object.assign({ status: "PLANNED", createdAt: Date.now() }, rec.plan));
      ev._saved = true;
    }
  } catch (e) { S.mon.mark("Database", "DEGRADED", "Could not save signals: " + errText(e)); }
}

async function es(tool, input, staleMs) {

// Finds the token contract on the first free-tier chain where CoinGecko's canonical id matches the taxonomy id. Cached in the taxonomy record.
async function contractFor(row) {
  const tx = S.tax[row.base]; if (!tx || !tx.cgId) return null;
  if (tx.contract && (tx.contract.address || Date.now() - (tx.contract.at || 0) < 7 * 864e5)) return tx.contract.address ? tx.contract : null;
  let found = null;
  for (const ch of F.EVM) {
    const res = await cg("search-coingecko", { query: N.lookupSymbol(row.base), type: "token", chain: ch.cg });
    const c = F.resolveContract(res, tx.cgId); if (c) { found = Object.assign(c, { chainid: ch.chainid, chainName: ch.name, regChain: REG_CHAIN[ch.cg], at: Date.now() }); break; }
  }
  const rec = Object.assign({}, tx, { contract: found || { address: null, at: Date.now(), why: "No ERC-20 contract on Ethereum, Arbitrum or Polygon with a matching CoinGecko id" } });
  S.tax[row.base] = rec;
  if (S.db) S.db.doc("taxonomy/" + taxId(row.base)).set(rec).catch(() => {});
  return found;
}
async function onchainStage(rows) {

  const liquid = rows.filter((r) => { const x = tk(r.symbol); return x && ("ABC".includes(x.tier) || inWL(r.symbol)) && S.tax[r.base] && S.tax[r.base].cgId; }).sort(wlFirst).slice(0, OC_MAX); // watchlist first in the 12-token Etherscan budget
  S.scan.stage = "On-chain transfers"; S.scan.done = 0; S.scan.total = liquid.length; render();
  const capHit = (e) => /rate limit|429|global-12h/i.test(errText(e) || (e && e.message) || "");
  const out = {};
  const halted = await pool(liquid, 2, async (r) => {
    const c = await contractFor(r); if (!c) return;

    let p; try { p = await es("get_token_transfers", { contractaddress: c.address, chainid: c.chainid, offset: 1000, page: 1, sort: "desc" }, 12 * 3600e3); } catch (e) { if (capHit(e)) { S.esCooldown = Date.now() + 12 * 3600e3; if (S.db) S.db.doc("logs/etherscan").set({ cooldownUntil: S.esCooldown, at: Date.now(), message: errText(e) }).catch(() => {}); } throw e; }
    const rowsT = p && Array.isArray(p.result) ? p.result : [];
    const price = (tk(r.symbol) || {}).last;
    const m = F.onchainSample(rowsT, price, exSet(c.regChain)), sc = F.onchainScore(m);
    out[r.symbol] = { chain: c.chainName, address: c.address, at: Date.now(), n: m ? m.n : 0, spanH: m && r4(m.spanH), totalUsd: m && r4(m.totalUsd), addrsH: m && r4(m.activeAddrPerH), thr: m && Math.round(m.thresholdUsd || 0), large1: m && m.large1, large2: m && m.large2, largeUsd: m && r4(m.largeUsd), mint: m && r4(m.mintUsd), burn: m && r4(m.burnUsd), netMint: m && r4(m.netMintShare), exN: m && m.exN, exIn: m && r4(m.exInUsd), exOut: m && r4(m.exOutUsd), exImb: m && r4(m.exImb), top10: m && r4(m.top10SenderShare), score: r4(sc.score), parts: Object.fromEntries(Object.entries(sc.parts).map(([k, v]) => [k, r4(v)])), coverage: r4(sc.coverage), why: sc.why || null };
  }, () => { S.scan.done++; if (S.scan.done % 4 === 0) render(); });
  if (Object.keys(out).length) { S.ochain = Object.assign({}, S.ochain || {}, out); S.ochainAt = Date.now(); } recomputeFlow();
  return halted && halted.code === "server_not_connected" ? null : halted; // a missing Etherscan connection must not stop the scan
}

function equityCurve(pf) {
  const pts = pf.curve; if (pts.length < 2) return "";
  const W = 560, H = 200, pl = 56, pr = 12, pt = 12, pb = 24, v = pts.map((p) => p.eq), lo = Math.min(...v), hi = Math.max(...v), rg = hi - lo || 1;
  const X = (i) => pl + i / (pts.length - 1) * (W - pl - pr), Y = (e) => pt + (hi - e) / rg * (H - pt - pb);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(p.eq).toFixed(1)}`).join(" ");
  const ticks = [lo, (lo + hi) / 2, hi];
  return `<svg class="hist" viewBox="0 0 ${W} ${H}" role="img" aria-label="Realized equity curve">${ticks.map((e) => `<line x1="${pl}" x2="${W - pr}" y1="${Y(e)}" y2="${Y(e)}" stroke="var(--line)"/><text x="${pl - 6}" y="${Y(e) + 4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="JetBrains Mono,monospace">${fusd(e)}</text>`).join("")}
    <path d="${d} L${X(pts.length - 1)} ${H - pb} L${X(0)} ${H - pb} Z" fill="var(--amber-soft)"/><path d="${d}" fill="none" stroke="var(--amber)" stroke-width="2"/><circle cx="${X(pts.length - 1)}" cy="${Y(v[v.length - 1])}" r="3.5" fill="var(--amber)"/>
    <text x="${pl}" y="${H - 6}" font-size="10.5" fill="var(--muted)">${t("start")}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end" font-size="10.5" fill="var(--muted)">${pts.length - 1} ${t("closed trades")}</text></svg>`;
}
